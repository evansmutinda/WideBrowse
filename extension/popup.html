<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WideBrowse</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3fbf9;
        --ink: #12332f;
        --muted: #5a736f;
        --accent: #2a9d8f;
        --line: #cfe8e3;
      }
      body {
        margin: 0;
        min-width: 260px;
        font: 13px/1.4 system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(160deg, #f7fffd, #e8f6f3 60%, #f4faf8);
      }
      main { padding: 14px; }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 6px 0;
      }
      .muted { color: var(--muted); }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 6px;
        background: #bbb;
      }
      .dot.on { background: var(--accent); box-shadow: 0 0 0 3px rgba(42,157,143,0.2); }
      .dot.pending { background: #e9c46a; }
      label { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }
      .actions {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }
      button {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
        font-weight: 600;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:hover { filter: brightness(0.98); }
    </style>
  </head>
  <body>
    <main>
      <h1>WideBrowse</h1>
      <div class="row">
        <span class="muted">Bridge</span>
        <span id="conn"><span class="dot" id="connDot"></span><span id="connText">…</span></span>
      </div>
      <div class="row">
        <span class="muted">Session</span>
        <span id="sessionText">idle</span>
      </div>
      <p id="hint" class="muted" style="margin:8px 0 0;font-size:11px;line-height:1.35;"></p>
      <label>
        MCP port
        <input id="port" type="number" min="1" max="65535" value="17321" />
      </label>
      <div class="actions">
        <button class="primary" id="reconnect" type="button">Reconnect bridge</button>
        <button id="endSession" type="button">End session</button>
        <button id="disconnect" type="button">Disconnect bridge</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
